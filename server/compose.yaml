services:
  api:
    image: meal-meter-api:latest
    build: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:${API_HOST_PORT:-18080}:8080"
    environment:
      NODE_ENV: production
      PORT: 8080
      DATABASE_URL: postgres://meal_meter:${POSTGRES_PASSWORD}@postgres:5432/meal_meter
      PAIRING_CODE: ${PAIRING_CODE}
      TRUST_PROXY: ${TRUST_PROXY:-}
      AI_BASE_URL: ${AI_BASE_URL:-http://cli-proxy-api:8317/v1}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_MODEL: ${AI_MODEL:-gpt-5.6-luna}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/health"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks:
      - default
      - cpa

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: meal_meter
      POSTGRES_USER: meal_meter
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - meal_meter_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U meal_meter -d meal_meter"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  meal_meter_data:

networks:
  cpa:
    external: true
    name: ${CPA_NETWORK_NAME:-cpamp_default}
