name: build-android

# 手动触发：Actions 页面 → Run workflow → 下载 APK artifact
# 两个 job 并行，各构建一个变体（单 ABI arm64-v8a 控制磁盘占用）：
#   app-debug.apk    dev client，需连 Metro 热更新
#   app-release.apk  独立包，JS 内嵌，装完即用
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - variant: debug
            task: assembleDebug
            path: debug/app-debug.apk
          - variant: release
            task: assembleRelease
            path: release/app-release.apk
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # CNG：android/ 目录不入库，CI 里由 app.json 生成
      - name: Generate native project
        working-directory: apps/expo
        run: npx expo prebuild --platform android --no-install

      # 单变体 + 单 ABI（arm64-v8a）控制磁盘/耗时；跳过生成代码 lint
      - name: Build APK
        working-directory: apps/expo/android
        run: ./gradlew ${{ matrix.task }} --no-daemon -PreactNativeArchitectures=arm64-v8a -x lint -x lintVitalRelease

      - uses: actions/upload-artifact@v4
        with:
          name: app-${{ matrix.variant }}
          path: apps/expo/android/app/build/outputs/apk/${{ matrix.path }}
