name: build-android

# 手动触发：Actions 页面 → Run workflow → 下载 APK artifact
# build-release / build-debug：各自独立 runner，单 ABI arm64-v8a 控制磁盘；
#   gradle 缓存（~/.gradle）跨 run 复用，冷编译 ~20min → 有缓存 ~5-8min
# smoke-android：只等 build-release-x86（不等较慢的 debug），起模拟器
#   先断言首页渲染（android-smoke.sh），再跑 Maestro 交互流（.maestro/smoke.yaml）
on:
  workflow_dispatch:

jobs:
  build-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # CNG：android/ 目录不入库，CI 里由 app.json 生成
      - name: Generate native project
        working-directory: apps/expo
        run: npx expo prebuild --platform android --no-install

      # gradle 依赖 + 构建缓存，跨 run 复用（wrapper properties 由 prebuild 确定）
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('apps/expo/android/gradle/wrapper/gradle-wrapper.properties') }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      # 单变体 + 单 ABI（arm64-v8a）控制磁盘/耗时；跳过生成代码 lint
      # 偶发 Gradle Plugin Portal / Maven 网络抖动导致配置期失败（如上轮 foojay 插件解析超时）
      # → 失败重试 3 次。配置期失败很快（秒级），重试成本低
      - name: Build release APK
        working-directory: apps/expo/android
        shell: bash
        run: |
          for attempt in 1 2 3; do
            echo "=== Gradle assembleRelease attempt $attempt/3 ==="
            if ./gradlew assembleRelease --no-daemon --build-cache -PreactNativeArchitectures=arm64-v8a -x lint -x lintVitalRelease; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "Attempt $attempt failed, retrying in 20s..."
              sleep 20
            fi
          done
          exit 1

      - uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: apps/expo/android/app/build/outputs/apk/release/app-release.apk

  build-debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # CNG：android/ 目录不入库，CI 里由 app.json 生成
      - name: Generate native project
        working-directory: apps/expo
        run: npx expo prebuild --platform android --no-install

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('apps/expo/android/gradle/wrapper/gradle-wrapper.properties') }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Build debug APK
        working-directory: apps/expo/android
        shell: bash
        run: |
          for attempt in 1 2 3; do
            echo "=== Gradle assembleDebug attempt $attempt/3 ==="
            if ./gradlew assembleDebug --no-daemon --build-cache -PreactNativeArchitectures=arm64-v8a -x lint -x lintVitalRelease; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "Attempt $attempt failed, retrying in 20s..."
              sleep 20
            fi
          done
          exit 1

      - uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: apps/expo/android/app/build/outputs/apk/debug/app-debug.apk

  # 仅用于模拟器冒烟的 x86_64 release APK：
  # CI 模拟器是 x86_64，加载不了 arm64-only 的 .so（SoLoader 崩），
  # 真机那份（app-release）保持 arm64-v8a 不变。
  build-release-x86:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Generate native project
        working-directory: apps/expo
        run: npx expo prebuild --platform android --no-install

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('apps/expo/android/gradle/wrapper/gradle-wrapper.properties') }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Build release APK (x86_64)
        working-directory: apps/expo/android
        shell: bash
        run: |
          for attempt in 1 2 3; do
            echo "=== Gradle assembleRelease (x86_64) attempt $attempt/3 ==="
            if ./gradlew assembleRelease --no-daemon --build-cache -PreactNativeArchitectures=x86_64 -x lint -x lintVitalRelease; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "Attempt $attempt failed, retrying in 20s..."
              sleep 20
            fi
          done
          exit 1

      - uses: actions/upload-artifact@v4
        with:
          name: app-release-x86
          path: apps/expo/android/app/build/outputs/apk/release/app-release.apk

  # Android 模拟器冒烟 + 交互级 E2E：x86_64 release APK 装进模拟器。
  # ① android-smoke.sh 断言首页渲染；② 同一台模拟器跑 Maestro 交互流
  #   （.maestro/smoke.yaml，与 iOS/Web 共用，iOS agent 维护）。
  # 首次安装未配对 → 不发网络请求，走本地默认数据渲染（覆盖真机首启路径）。
  # 只依赖 build-release-x86 → x86 包一好就起模拟器，不干等其它构建。
  smoke-android:
    needs: build-release-x86
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Download x86 release APK
        uses: actions/download-artifact@v4
        with:
          name: app-release-x86
          path: apk

      # GitHub runner 已启用 KVM，需放开 /dev/kvm 设备权限供模拟器硬件加速
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # Maestro 交互级 E2E 依赖：官方安装脚本装到 ~/.maestro/bin
      # （JAVA_HOME 由上方 setup-java@v4 temurin 17 提供）
      - name: Install Maestro
        run: |
          curl -Ls "https://get.maestro.mobile.dev" | bash
          "$HOME/.maestro/bin/maestro" --version

      - name: Run emulator smoke + Maestro E2E
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          # 该 action 按行执行 script，多行循环会被拆开（此前已踩坑）
          # → 逻辑放独立脚本文件，这里单行调用
          # 脚本内部：先 android-smoke.sh 首页渲染冒烟，再 maestro test 交互流
          script: bash .github/scripts/android-e2e.sh

      - name: Upload smoke artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-artifacts
          if-no-files-found: warn
          path: |
            screen.png
            screen_fail.png
            window_dump.xml
            logcat.txt
