name: build-android

# 手动触发：Actions 页面 → Run workflow → 下载 APK artifact
# build job：两个并行子 job（debug/release），单 ABI arm64-v8a 控制磁盘
# smoke-android job：把 release APK 装进 Android 模拟器，断言首页渲染
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - variant: debug
            task: assembleDebug
            path: debug/app-debug.apk
          - variant: release
            task: assembleRelease
            path: release/app-release.apk
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # CNG：android/ 目录不入库，CI 里由 app.json 生成
      - name: Generate native project
        working-directory: apps/expo
        run: npx expo prebuild --platform android --no-install

      # 单变体 + 单 ABI（arm64-v8a）控制磁盘/耗时；跳过生成代码 lint
      # 偶发 Gradle Plugin Portal / Maven 网络抖动导致配置期失败（如上轮 foojay 插件解析超时）
      # → 失败重试 3 次。配置期失败很快（秒级），重试成本低
      - name: Build APK
        working-directory: apps/expo/android
        shell: bash
        run: |
          for attempt in 1 2 3; do
            echo "=== Gradle ${{ matrix.task }} attempt $attempt/3 ==="
            if ./gradlew ${{ matrix.task }} --no-daemon -PreactNativeArchitectures=arm64-v8a -x lint -x lintVitalRelease; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "Attempt $attempt failed, retrying in 20s..."
              sleep 20
            fi
          done
          exit 1

      - uses: actions/upload-artifact@v4
        with:
          name: app-${{ matrix.variant }}
          path: apps/expo/android/app/build/outputs/apk/${{ matrix.path }}

  # Android 模拟器冒烟：release APK 装进模拟器，启动 App，断言首页渲染。
  # 首次安装未配对 → 不发网络请求，走本地默认数据渲染（覆盖真机首启路径）。
  smoke-android:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Download release APK
        uses: actions/download-artifact@v4
        with:
          name: app-release
          path: apk

      # GitHub runner 已启用 KVM，需放开 /dev/kvm 设备权限供模拟器硬件加速
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run emulator smoke test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          # 该 action 按行执行 script，多行循环会被拆开（此前已踩坑）
          # → 逻辑放独立脚本文件，这里单行调用
          script: bash .github/scripts/android-smoke.sh

      - name: Upload smoke artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-artifacts
          path: |
            screen.png
            window_dump.xml
            logcat_fail.txt
