name: ios-e2e

# 手动触发：Actions 页面 → Run workflow → 跑 iOS 模拟器 Release 构建 + Maestro 交互流
# 使用 .maestro/smoke.yaml（与 Android/Web 共用同一批关键流）
# 费用：macOS runner 仅在【公开仓库】免费 —— 本仓库已切 public
# 缓存：ccache + CocoaPods + ios/（下方 restore 步骤）。冷跑 ~30min 填充 ccache 并落缓存，
# 之后 pod 的 ObjC/C++ 编译按内容命中 → 热跑 ~10min；依赖/补丁变更会强制重建。
on:
  workflow_dispatch:

jobs:
  smoke-ios:
    # macos-15 上所有 Xcode 都有问题：16.4 默认 SPM 解析回归、16.1-16.3 平台缺失、
    # 26.0-26.3 的 Swift importer 拒绝 RN 0.86 缺失的 jsi umbrella / weak-let。
    # macos-26 默认 Xcode 26.6（build 17F113）= 本机 Mac 验证过的环境，直接可用；
    # patch-package 的 weak-let 修复保留以兼容未来更严格的 Swift 编译器。
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 26.6
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.6'

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      # ── iOS 构建缓存 ──
      # 1) ios/（含 Pods + Podfile.lock）：命中即跳过 prebuild，避免每轮重新生成原生工程。
      # 2) ccache：pod 的 ObjC/C++ 编译按源码内容+编译参数寻址，跨 runner 命中。
      #    （恢复的 DerivedData/build.db 已被证明无效：环境一致仍全量重编，XCBuild 判全部过期。）
      # 3) CocoaPods spec 索引：仅冷跑 pod install 时用到。
      - name: Restore native ios project
        id: restore-ios
        uses: actions/cache/restore@v4
        with:
          path: apps/expo/ios
          key: ios-native-${{ hashFiles('apps/expo/app.json', 'apps/expo/package.json', 'package-lock.json', 'patches/**') }}
          restore-keys: ios-native-

      # CNG：仅在 ios/ 缓存未命中时生成（命中直接用，保持 Pods mtime 稳定）
      - name: Generate native project
        if: steps.restore-ios.outputs.cache-hit != 'true'
        working-directory: apps/expo
        run: npx expo prebuild --platform ios --no-install

      # ccache：内容寻址编译缓存。恢复的 DerivedData 已被证明无法跨 runner 增量（XCBuild 对恢复的
      # build.db 判定全部输入过期 → 全量重编）；ccache 按源码内容+编译参数命中，不依赖 mtime/build.db。
      - name: Install ccache
        run: |
          brew install ccache
          ccache --version
          # XCBuild 的宏探测（clang -v -E -dM …）走 ccache 的 Apple-clang 路径会失败；
          # 生成 wrapper：探测（含 -dM）直调真实 clang 绕过 ccache，其余编译走 ccache。
          # 真实编译器路径用 xcrun 运行时解析，避免硬编码 Xcode 版本号。
          mkdir -p "$HOME/ccache-bin"
          REAL_CC="$(xcrun -f clang)"
          REAL_CXX="$(xcrun -f clang++)"
          for pair in "clang|$REAL_CC" "clang++|$REAL_CXX"; do
            name="${pair%%|*}"; real="${pair#*|}"
            printf '#!/bin/bash\nfor a in "$@"; do\n  [ "$a" = "-dM" ] && exec "%s" "$@"\ndone\nexec /opt/homebrew/bin/ccache "%s" "$@"\n' \
              "$real" "$real" > "$HOME/ccache-bin/$name"
            chmod +x "$HOME/ccache-bin/$name"
          done
          # ccache 配置写入文件（~/.ccache/ccache.conf）而非仅环境变量：XCBuild 可能
          # 剥离 CCACHE_* env（此前已证其剥离 PATH），配置文件在 env 缺失时仍生效。
          # log_file 便于诊断每条 uncacheable 的确切原因。
          mkdir -p "$HOME/.ccache"
          printf 'cache_dir = %s/Library/Caches/ccache\nmax_size = 2.0G\ncompression = true\nsloppiness = clang_index_store,time_macros,modules\ndepend_mode = true\nlog_file = %s/Library/Caches/ccache.log\n' \
            "$HOME" "$HOME" > "$HOME/.ccache/ccache.conf"

      - name: Restore ccache cache
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/ccache
          key: ios-ccache-${{ hashFiles('apps/expo/app.json', 'apps/expo/package.json', 'package-lock.json', 'patches/**') }}
          restore-keys: ios-ccache-

      # CocoaPods：pod 源码 + CDN spec 索引，内容寻址，按依赖 hash 作 key（不膨胀）
      - name: Restore CocoaPods cache
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/CocoaPods
          key: ios-pods-${{ hashFiles('apps/expo/package.json', 'package-lock.json', 'patches/**') }}
          restore-keys: ios-pods-

      # Maestro 是 JVM 应用，需 Java（与 Android smoke 一致用 temurin 17）
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # 选第一个可用 iPhone 模拟器并开机（headless，无需 GUI）
      - name: Boot simulator
        run: |
          UDID=$(xcrun simctl list devices available -j | jq -r '.devices | to_entries[] | .value[] | select(.name | startswith("iPhone")) | .udid' | head -1)
          echo "Booting simulator: $UDID"
          xcrun simctl boot "$UDID" 2>/dev/null || true
          echo "UDID=$UDID" >> "$GITHUB_ENV"

      - name: Install Maestro
        run: |
          curl -Ls "https://get.maestro.mobile.dev" | bash
          "$HOME/.maestro/bin/maestro" --version

      # Release + 内嵌 JS bundle → 不依赖 Metro；--device 指向已开机的模拟器。
      # 命中 ios/ 缓存时加 --no-install：expo 按「临时预构建目录里的依赖变更标记」决定是否重跑
      # pod install，冷 runner 上没有该标记 → 每轮重装 pods；--no-install 直接跳过。
      # CC/CXX 指向 ccache：pod 的 ObjC/C++（RNSVG/Reanimated/Screens…）按内容命中免重编；
      # Swift 文件 ccache 不缓存但数量少。构建末尾 ccache -s 输出命中率便于诊断。
      - name: Build & install Release app
        working-directory: apps/expo
        env:
          EXPO_DEBUG: '1'
        run: |
          export CCACHE_DIR="$HOME/Library/Caches/ccache"
          export CCACHE_COMPRESS=1
          export CCACHE_MAXSIZE=2G
          # RN pods 用 -fmodules：需 depend mode + modules sloppiness 才可缓存
          # （缺任一个 ccache 报 could_not_use_modules，全部编译 uncacheable）。
          export CCACHE_DEPEND=1
          export CCACHE_SLOPPINESS=clang_index_store,time_macros,modules
          # CC/CXX 指向 Install ccache 步骤生成的 wrapper：-dM 宏探测直调真实 clang
          # （ccache 的 Apple-clang 路径处理该探测会失败），其余编译走 ccache。
          export CC="$HOME/ccache-bin/clang"
          export CXX="$HOME/ccache-bin/clang++"
          INSTALL_FLAG=""
          if [ "${{ steps.restore-ios.outputs.cache-hit }}" = "true" ]; then
            INSTALL_FLAG="--no-install"
          fi
          npx expo run:ios --configuration Release --no-bundler $INSTALL_FLAG --device "$UDID"
          echo "── ccache stats ──"
          ccache -s
          echo "── uncacheable reasons ──"
          grep -oE "Result: [a-z_]+" "$HOME/Library/Caches/ccache.log" 2>/dev/null | sort | uniq -c | sort -rn | head -10

      # pod install 在构建步骤内执行后，ios/Pods 才齐 → 这里保存 ios/ 缓存（含 Pods）。
      # 仅 prebuild 跑过（缓存未命中）时保存，命中轮不重复上传。
      - name: Save native ios project cache
        if: steps.restore-ios.outputs.cache-hit != 'true' && success()
        uses: actions/cache/save@v4
        with:
          path: apps/expo/ios
          key: ios-native-${{ hashFiles('apps/expo/app.json', 'apps/expo/package.json', 'package-lock.json', 'patches/**') }}

      # 跨平台冒烟流（文本匹配需正则全串，见 .maestro/smoke.yaml 头注）
      - name: Run Maestro smoke
        run: $HOME/.maestro/bin/maestro test .maestro/smoke.yaml

      - name: Upload smoke artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ios-smoke-artifacts
          if-no-files-found: ignore
          path: |
            ~/.maestro/tests/
