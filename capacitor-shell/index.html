<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0d6b4d" />
    <title>餐标</title>
    <style>
      :root { color-scheme: light; font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif; }
      body { min-height: 100vh; margin: 0; display: grid; place-items: center; background: #0d6b4d; color: #f7faee; }
      main { text-align: center; padding: 32px; }
      b { display: grid; place-items: center; width: 72px; height: 72px; margin: 0 auto 20px; border-radius: 18px; background: #b9e44c; color: #0d6b4d; font-size: 38px; }
      h1 { margin: 0 0 8px; font-size: 24px; }
      p { margin: 0; color: rgba(255,255,255,.72); font-size: 13px; }
    </style>
  </head>
  <body><main><b>餐</b><h1>餐标</h1><p>正在连接你的饮食记录…</p></main></body>
</html>
